name: Build unsigned iPhone app (.ipa)
on:
  push:
    branches: [ios-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: brew install xcodegen
      - name: Generate project
        working-directory: apps/house-capture
        run: xcodegen generate
      - name: Build (no signing)
        working-directory: apps/house-capture
        run: |
          xcodebuild -project HouseCapture.xcodeproj -scheme HouseCapture \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        working-directory: apps/house-capture
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HouseCapture.app Payload/
          zip -qry 3DModelAnything.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: 3DModelAnything-ipa
          path: apps/house-capture/3DModelAnything.ipa
